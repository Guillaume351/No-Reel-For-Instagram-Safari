<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' https://nextcloud.d1.guillaumeclaverie.com; frame-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="No Reel For Instagram Icon">
    <p id="iosIntro" class="platform-ios">Enable the Safari extension to hide selected distractions on instagram.com.</p>
    <p id="macStateUnknown" class="platform-mac state-unknown">Turn on No Reel For Instagram in Safari Settings &gt; Extensions.</p>
    <p id="macStateOn" class="platform-mac state-on">No Reel For Instagram is active. Choose what to hide from its Safari toolbar button.</p>
    <p id="macStateOff" class="platform-mac state-off">No Reel For Instagram is off. Enable it in Safari Settings &gt; Extensions.</p>
    <button id="openPreferences" class="platform-mac open-preferences">Quit and Open Safari Settings…</button>

    <section class="instructions">
        <h2 id="instructionsTitle"></h2>
        <ol id="instructionsList"></ol>
    </section>

    <section class="contact" id="wellbeingSection">
        <h2 id="wellbeingTitle"></h2>
        <p id="wellbeingBody"></p>
    </section>

    <section class="ios-video platform-ios" id="iosVideoSection" hidden>
        <h2 id="iosVideoTitle"></h2>
        <div class="video-wrapper">
            <video id="iosInstallationVideo" controls playsinline preload="metadata">
                <source id="iosVideoSource" type="video/mp4">
            </video>
        </div>
        <p class="video-fallback">
            <a id="iosVideoLink" target="_blank" rel="noopener noreferrer"></a>
        </p>
    </section>

    <section class="contact" id="contactSection"></section>
</body>
</html>
